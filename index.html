        // ===============================================

        // ===============================================

        // Global State Store & Hooks Replacement
        const useGlobalState = (initialState, key) => {
            let state = JSON.parse(localStorage.getItem(`archiMate_${key}`)) || initialState;
            return { 
                getState: () => state, 
                setState: (newStateOrCallback) => {
                    if (typeof newStateOrCallback === 'function') {
                        state = newStateOrCallback(state);
                    } else {
                        Object.keys(newStateOrCallback).forEach(key => {
                            state[key] = newStateOrCallback[key];
                        });
                        Object.assign(state, newStateOrCallback);
                    }
                    localStorage.setItem(`archiMate_${key}`, JSON.stringify(state));
                    // In a real app, this would trigger re-render; here we rely on manual prop passing/rerender calls
                }, 
                getValue: () => state
            };
        };

        // Toast System
        const showToast = (message) => {
            const toastContainer = document.getElementById('root');
            let existingToast = document.querySelector('.toast-message');
            if (!existingToast) {
                existingToast = document.createElement('div');
                existingToast.className = 'absolute top-4 left-1/2 -translate-x-1/2 z-[100] bg-slate-900 text-white px-4 py-2 rounded-full text-sm font-medium shadow-2xl animate-in slide-in-from-top-10 max-w-sm text-center toast-message';
                toastContainer.appendChild(existingToast);
            }
            existingToast.textContent = message;
            // Clear any existing timeout and set a new one
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                existingToast.remove();
            }, 4000);
        };

        // Confirmation Modal System
        let confirmDialogState = { isOpen: false, message: '', onConfirm: null };
        const requestConfirm = (message, onConfirmCallback) => {
            confirmDialogState = { isOpen: true, message, onConfirm: onConfirmCallback };
            renderRoot(); // Re-render to show modal
        };

        const executeConfirm = () => {
            if (confirmDialogState.onConfirm) confirmDialogState.onConfirm();
            closeConfirm();
        };

        const closeConfirm = () => {
            confirmDialogState = { isOpen: false, message: '', onConfirm: null };
            renderRoot(); // Re-render to hide modal
        };

        // ===============================================
        // ✨ AUTH SCREEN (Login/Register)
        // ===============================================

        function AuthScreen({ onLogin, t }) {
            const [mode, setMode] = React.useState('login'); 
            const [formData, setFormData] = React.useState({ name: '', email: '', password: '', code: '' });
            const [generatedCode, setGeneratedCode] = React.useState('');

            // --- Event Handlers ---
            const handleRegister = (e) => {
                e.preventDefault();
                if (mode === 'login') {
                    onLogin({ email: formData.email, name: formData.email.split('@')[0] });
                } else if (mode === 'register') {
                    // Simulate code generation and state update
                    const code = Math.floor(100000 + Math.random() * 900000).toString();
                    setGeneratedCode(code);
                    setMode('verify');
                    showToast(`${t('codeSentMsg')} TEST KODU: ${code}`);
                }
            };

            const handleVerify = (e) => {
                e.preventDefault();
                if (formData.code === generatedCode) {
                    onLogin({ email: formData.email, name: formData.name });
                } else {
                    showToast(t('wrongCode'));
                }
            };

            // --- Render Logic ---
            let formContent;
            if (mode === 'verify') {
                formContent = `
                    <form onSubmit=${handleVerify} class="space-y-4 animate-in slide-in-from-right-4">
                        <div class="text-center mb-6">
                            <p class="text-sm text-slate-600 font-medium">${formData.email} adresine gönderilen 6 haneli kodu girin.</p>
                        </div >

                                <input required type="text" maxlength="6" value=${formData.code} onchange={(e) => setFormData({...formData, code: e.target.value})} class="w-full bg-slate-50 pl-10 pr-4 py-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-center tracking-[0.5em] font-bold text-lg" placeholder="••••••" />
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl mt-2 hover:bg-indigo-700 transition-colors shadow-md">${t('verifyBtn')}</button>
                        <button type="button" onclick={() => setMode('register')} class="w-full text-center text-sm font-semibold text-indigo-600 mt-4 hover:text-indigo-800">Geri Dön</button>
                    </form>
                `;
            } else { // mode === 'login' or mode === 'register' (before verification)
                 const isRegister = mode === 'register';
                formContent = `
                    <form onSubmit=${handleRegister} class="space-y-4 animate-in fade-in">
                        ${isRegister ? `
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${t('fullName')}</label>
                                <div class="relative">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>

                                </div>

                        ` : ''}

                        <div>

                     localStorage.setItem('archiMate_projects_v8', JSON.stringify([defaultProject]));
                }

                // For simplicity in this conversion, we will treat the main App component's state as the source of truth.
            };


            // --- Event Handlers Bindings (To make JSX onClick work) ---
            window.onOpenProject = (id) => { 
                document.querySelector('input[name="selectedProjectId"]').value = id;
                App.setState(prev => ({...prev, selectedProject: parseInt(id)});
            };

             const App = {
                 state: { activeTab: 'dashboard', selectedProject: null },
                 setState: (updater) => {
                     // Basic state update logic for the main app container
                    if (typeof updater === 'function') {
                        App.state = updater(App.state);
                    } else {
                         Object.assign(App.state, updater);
                    }
                    renderRoot(); // Rerender on critical state change
                 },
                 getState: () => App.state
             };

            // Expose key functions globally for inline JSX handlers
            window.showToast = showToast;
            window.requestConfirm = requestConfirm;
            window.executeConfirm = executeConfirm;
            window.closeConfirm = closeConfirm;
            window.setActiveTab = (tab) => App.setState({...App.state, activeTab: tab});

             // --- Render Loop ---
             const renderRoot = () => {
                 root.innerHTML = App(currentAuthUser); 
             };


            // Start the application rendering cycle
            setupGlobalState();
            renderRoot();
        }
